<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<title>画廊 — 走进名画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1612; font-family: Georgia, serif; }
#app { width: 100vw; height: 100vh; }
canvas { display: block; }
.title { position: fixed; top: 28px; left: 32px; color: rgba(232, 214, 180, 0.88); pointer-events: none; z-index: 10; text-shadow: 0 2px 18px rgba(0,0,0,0.7); }
.title h1 { font-size: 22px; font-weight: normal; letter-spacing: 10px; margin-bottom: 6px; }
.title p { font-size: 11px; letter-spacing: 3px; color: rgba(232, 214, 180, 0.5); font-style: italic; }
.hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); color: rgba(232, 214, 180, 0.55); font-size: 12px; letter-spacing: 3px; pointer-events: none; z-index: 10; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
#caption { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); color: rgba(255, 236, 200, 0.92); text-align: center; pointer-events: none; z-index: 10; text-shadow: 0 2px 16px rgba(0,0,0,0.8); min-height: 48px; }
#caption .name { font-size: 18px; letter-spacing: 6px; margin-bottom: 6px; }
#caption .meta { font-size: 12px; letter-spacing: 2px; color: rgba(232, 214, 180, 0.55); font-style: italic; }
#toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 14px 28px; border: 1px solid rgba(232, 214, 180, 0.35); background: rgba(20, 16, 12, 0.88); color: rgba(232, 214, 180, 0.85); letter-spacing: 3px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.35s; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="title"><h1>THE GALLERY</h1><p>点击画框，走进画里</p></div>
<div id="caption"><div class="name"></div><div class="meta"></div></div>
<div class="hint">移动鼠标瞄准画框 · 点击进入场景 · A / D 沿墙移动</div>
<div id="toast">该作品尚未开放</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const container = document.getElementById('app');
const captionName = document.querySelector('#caption .name');
const captionMeta = document.querySelector('#caption .meta');
const toastEl = document.getElementById('toast');

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a1612, 8, 18);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(0, 1.62, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x14110e, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

function createCanvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function drawScream(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#4a235a');
  g.addColorStop(0.35, '#c0392b');
  g.addColorStop(0.6, '#e67e22');
  g.addColorStop(1, '#873600');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(180, 60, 30, 0.35)';
  for (let y = 0; y < h; y += 6) {
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
      const py = y + Math.sin(x * 0.04 + y * 0.03) * 10;
      if (x === 0) ctx.moveTo(x, py);
      else ctx.lineTo(x, py);
    }
    ctx.stroke();
  }
  ctx.fillStyle = '#1a1a28';
  ctx.fillRect(0, h * 0.72, w, h * 0.08);
  ctx.fillStyle = '#d4a574';
  ctx.beginPath();
  ctx.ellipse(w * 0.52, h * 0.58, 18, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a0604';
  ctx.beginPath();
  ctx.ellipse(w * 0.52, h * 0.62, 6, 8, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawSunflowers(ctx, w, h) {
  ctx.fillStyle = '#d4a017';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    ctx.strokeStyle = 'rgba(180, 120, 20, 0.25)';
    ctx.beginPath();
    ctx.moveTo(Math.random() * w, 0);
    ctx.lineTo(Math.random() * w, h);
    ctx.stroke();
  }
  ctx.fillStyle = '#c4a83a';
  ctx.beginPath();
  ctx.ellipse(w * 0.5, h * 0.78, 38, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f0c430';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.ellipse(w * 0.5 + Math.cos(a) * 16, h * 0.42 + Math.sin(a) * 12, 14, 8, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#3a2a10';
  ctx.beginPath();
  ctx.arc(w * 0.5, h * 0.42, 12, 0, Math.PI * 2);
  ctx.fill();
}

function drawLocked(ctx, w, h, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(220, 200, 160, 0.35)';
  ctx.font = '22px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText('即将开放', w / 2, h / 2);
}

const artworks = [
  { id: 'scream', title: 'THE SCREAM', artist: 'Edvard Munch · 1893', href: 'scream-3d/', draw: drawScream, w: 0.78, h: 1.02 },
  { id: 'sunflowers', title: 'SUNFLOWERS', artist: 'Vincent van Gogh · 1888', href: 'sunflowers-3d/', draw: drawSunflowers, w: 0.82, h: 1.02 },
  { id: 'starry', title: 'THE STARRY NIGHT', artist: 'Vincent van Gogh · 1889', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#1a2744', '#3d5a80') },
  { id: 'water', title: 'WATER LILIES', artist: 'Claude Monet · 1919', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#2d4a3e', '#6a8f7a') },
  { id: 'pearl', title: 'GIRL WITH A PEARL EARRING', artist: 'Vermeer · 1665', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#1e2a38', '#c4a574') },
  { id: 'kiss', title: 'THE KISS', artist: 'Gustav Klimt · 1908', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#5c3b12', '#d4b44a') },
  { id: 'wave', title: 'THE GREAT WAVE', artist: 'Hokusai · 1831', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#16324f', '#d8d2c4') },
  { id: 'nightcafe', title: 'THE NIGHT CAFE', artist: 'Vincent van Gogh · 1888', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#6b1d1d', '#c9a227') },
  { id: 'persist', title: 'THE PERSISTENCE OF MEMORY', artist: 'Salvador Dalí · 1931', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#c4a574', '#6a5a38') },
  { id: 'sistine', title: 'THE CREATION OF ADAM', artist: 'Michelangelo · 1512', draw: (ctx, w, h) => drawLocked(ctx, w, h, '#8a6a4a', '#efe6d0') },
];

const wallTex = createCanvasTexture(1024, 512, (ctx, w, h) => {
  ctx.fillStyle = '#3a332c';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.08) + ')';
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
});
wallTex.wrapS = THREE.RepeatWrapping;
wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(3, 1.4);

const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.92, color: 0x6a5e50 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 5.2), wallMat);
backWall.position.set(0, 2.2, -0.6);
scene.add(backWall);

const sideMat = wallMat.clone();
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5.2), sideMat);
leftWall.position.set(-8, 2.2, 3.4);
leftWall.rotation.y = Math.PI / 2;
scene.add(leftWall);
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5.2), sideMat);
rightWall.position.set(8, 2.2, 3.4);
rightWall.rotation.y = -Math.PI / 2;
scene.add(rightWall);

const floorTex = createCanvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#4a3518';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 12; i++) {
    ctx.fillStyle = i % 2 ? '#5a4020' : '#3e2c14';
    ctx.fillRect((i / 12) * w, 0, w / 12, h);
  }
});
floorTex.wrapS = THREE.RepeatWrapping;
floorTex.repeat.set(8, 4);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 10),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85, color: 0x8a6a3a })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const woodMat = new THREE.MeshStandardMaterial({ color: 0x5a3a18, roughness: 0.7, metalness: 0.08 });
const clickable = [];
const xs = [-3.2, -1.6, 0, 1.6, 3.2];
const ys = [2.42, 1.12];

function createFrame(art, x, y) {
  const g = new THREE.Group();
  const fw = art.w || 0.8;
  const fh = art.h || 1.0;
  const tex = createCanvasTexture(256, 320, art.draw);
  const painting = new THREE.Mesh(
    new THREE.PlaneGeometry(fw, fh),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55 })
  );
  painting.position.z = 0.04;
  painting.userData = art;
  g.add(painting);
  const hit = new THREE.Mesh(
    new THREE.PlaneGeometry(fw + 0.12, fh + 0.16),
    new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
  );
  hit.position.z = 0.06;
  hit.userData = art;
  g.add(hit);
  const t = 0.055;
  const top = new THREE.Mesh(new THREE.BoxGeometry(fw + t * 2, t, 0.08), woodMat);
  top.position.set(0, fh / 2 + t / 2, 0.02);
  g.add(top);
  const bot = new THREE.Mesh(new THREE.BoxGeometry(fw + t * 2, t, 0.08), woodMat);
  bot.position.set(0, -fh / 2 - t / 2, 0.02);
  g.add(bot);
  const left = new THREE.Mesh(new THREE.BoxGeometry(t, fh, 0.08), woodMat);
  left.position.set(-fw / 2 - t / 2, 0, 0.02);
  g.add(left);
  const right = new THREE.Mesh(new THREE.BoxGeometry(t, fh, 0.08), woodMat);
  right.position.set(fw / 2 + t / 2, 0, 0.02);
  g.add(right);
  const lamp = new THREE.PointLight(0xffe6b0, art.href ? 0.85 : 0.28, 2.4);
  lamp.position.set(0, fh / 2 + 0.18, 0.35);
  g.add(lamp);
  g.position.set(x, y, -0.52);
  scene.add(g);
  clickable.push(painting, hit);
}

artworks.forEach((art, i) => {
  const col = i % 5;
  const row = Math.floor(i / 5);
  createFrame(art, xs[col], ys[row]);
});

scene.add(new THREE.AmbientLight(0xd8c8a8, 0.35));
scene.add(new THREE.HemisphereLight(0xffe6c0, 0x2a2018, 0.4));
const hallLight = new THREE.DirectionalLight(0xfff0d0, 0.45);
hallLight.position.set(2, 6, 8);
scene.add(hallLight);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;
let toastTimer = 0;
const camTarget = new THREE.Vector3(0, 1.62, 6.2);
const look = { x: 0, y: 0 };
const keys = { left: false, right: false };

window.addEventListener('mousemove', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  look.x = pointer.x;
  look.y = pointer.y;
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
});

function showToast() {
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

function enterArtwork(art) {
  if (art.href) {
    window.location.href = art.href;
    return;
  }
  showToast();
}

function tryEnterAt(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  camera.updateMatrixWorld();
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable, true);
  if (hits.length > 0) enterArtwork(hits[0].object.userData);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  tryEnterAt(e.clientX, e.clientY);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  if (keys.left) camTarget.x -= 2.4 * delta;
  if (keys.right) camTarget.x += 2.4 * delta;
  camTarget.x = Math.max(-3.4, Math.min(3.4, camTarget.x));
  camera.position.x += (camTarget.x - camera.position.x) * 0.08;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = -look.x * 0.18;
  camera.rotation.x = look.y * 0.08;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable);
  const next = hits.length > 0 ? hits[0].object : null;
  if (next !== hovered) {
    if (hovered) hovered.material.emissive = new THREE.Color(0x000000);
    hovered = next;
    if (hovered) {
      hovered.material.emissive = new THREE.Color(hovered.userData.href ? 0x332208 : 0x111111);
      captionName.textContent = hovered.userData.title;
      captionMeta.textContent = hovered.userData.artist + (hovered.userData.href ? '  ·  点击进入' : '  ·  尚未开放');
      document.body.style.cursor = hovered.userData.href ? 'pointer' : 'default';
    } else {
      captionName.textContent = '';
      captionMeta.textContent = '';
      document.body.style.cursor = 'default';
    }
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
